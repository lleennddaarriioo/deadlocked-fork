<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    
    <!-- Purple to Cyan Neon Gradient -->
    <linearGradient id="purpleCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Shield Tile -->
  <rect width="128" height="128" rx="28" fill="#0b0f19" />
  <rect width="128" height="128" rx="28" fill="url(#purpleGlow)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#purpleCyanGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Monogram D / Interlocking Padlock Body -->
  <!-- Left Shackle Arc / D-Curve -->
  <path d="M 44 32 C 78 32 94 48 94 64 C 94 80 78 96 44 96 V 32 Z" fill="none" stroke="url(#purpleCyanGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner Shackle Lock Bar -->
  <path d="M 44 48 H 64 C 74 48 80 54 80 64 C 80 74 74 80 64 80 H 44" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />

  <!-- Center Reticle Focus Target -->
  <circle cx="64" cy="64" r="10" fill="#131b2e" stroke="#06b6d4" stroke-width="2.5" />
  <circle cx="64" cy="64" r="3" fill="#a855f7" />
  
  <!-- Precision Crosshair Nubs -->
  <line x1="64" y1="48" x2="64" y2="52" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="76" x2="64" y2="80" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="48" y1="64" x2="52" y2="64" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="64" x2="80" y2="64" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
</svg>
