[workspace]
members = ["cheat", "server", "shared"]
resolver = "3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[workspace.dependencies]
shared.path = "shared"

utils.git = "https://codeberg.org/avitrano/utils"

glam = { version = "0.33", features = ["bytemuck", "serde"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tungstenite = "0.26"
url = "2.5"
uuid = { version = "1.26", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0
debug = false
incremental = true
overflow-checks = false
